services:
  resources-server:
    build: .
    container_name: resources-server
    ports:
      - "${RESOURCE_SERVER_PORT:-3100}:3100"
    environment:
      - PYTHONUNBUFFERED=1
      - RESOURCE_CLEANUP_INTERVAL=${RESOURCE_CLEANUP_INTERVAL:-3600}
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl, so probe with Python's standard library
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3100/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - resource-net

networks:
  resource-net:
    driver: bridge
