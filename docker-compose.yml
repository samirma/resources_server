services:
  resources-server:
    build: .
    container_name: resources-server
    ports:
      - "3100:3100"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - resource-net

networks:
  resource-net:
    driver: bridge
